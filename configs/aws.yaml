# AWS profile (ADR 0002, option A). Loaded with LH_PROFILE=aws on top of
# configs/default.yaml, which it overrides key by key. State only what differs.
# Paths are fixed because the systemd services run from /opt and keep their data in
# /var/lib, not in the repository checkout.

db_path: /var/lib/lookalike-hunter/lookalike.duckdb
dataset_path: /var/lib/lookalike-hunter/eval.jsonl

capture:
  output_dir: /var/lib/lookalike-hunter/captures
  # The Vantage point stored with each capture (P2.2): AWS, region eu-north-1.
  vantage: aws-eu-north-1

alert:
  file_path: /var/lib/lookalike-hunter/alerts.jsonl

# P2.1: the feed timer (deploy/lookalike-feed.timer) appends Feed entries here, and the
# watch loop captures the fresh ones. The file is outside git (docs/feed-data.md).
watch:
  feed_entries_path: /var/lib/lookalike-hunter/feed-entries.jsonl

# The local default is the offline stub. The instance runs the real model, as the
# README describes for the Mistral free tier (no paid tier without approval).
classify:
  backend: mistral
