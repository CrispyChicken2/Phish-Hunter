[project]
name = "lookalike-hunter"
version = "0.1.0"
description = "Detect brand-impersonating domains from Certificate Transparency and triage them with a VLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnstwist==20250130",
    "duckdb>=1.5,<2",
    "httpx>=0.27",
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings[yaml]>=2.6",
    "pytz>=2024.1",
    "rapidfuzz>=3.10",
    "structlog>=24.4",
    "tldextract>=5.1",
    "websockets>=13",
]

[project.scripts]
lookalike-hunter = "lookalike_hunter.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pytz>=2026.3.1.20260727",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookalike_hunter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["dnstwist", "dnstwist.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Confusable characters are the subject matter of these files.
"src/lookalike_hunter/scoring/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["RUF001", "RUF003"]
