networks:
  # The browser runs hostile content; keep it off the network the other
  # services share so a compromise cannot reach them.
  ct:
  capture:

services:
  # Local Certificate Transparency aggregator exposing a certstream-compatible
  # websocket on ws://localhost:8080/ (the public calidog server is unreliable).
  certstream:
    image: 0rickyy0/certstream-server-go:v1.10.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks: [ct]

  # Visits suspicious sites. Everything here is damage limitation: the browser is
  # the one component that runs attacker-controlled content.
  capture:
    build:
      context: .
      dockerfile: docker/capture/Dockerfile
    profiles: ["tools"] # only started by `lookalike-hunter capture`, one job at a time
    networks: [capture]
    user: pwuser
    security_opt:
      - no-new-privileges:true
      # Docker's default seccomp profile plus one rule: the namespace and chroot
      # calls Chromium's sandbox needs, which the default allows only to a
      # container holding capabilities this one has dropped. So the container
      # keeps a system-call filter and the browser keeps its sandbox (P3.2;
      # this replaced seccomp=unconfined). Relative to the project directory,
      # where `lookalike-hunter capture` runs compose. tests/test_seccomp.py
      # checks the file is exactly Docker's default plus that rule.
      - seccomp=./docker/capture/seccomp-chromium.json
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    # A runaway page cannot exhaust the host.
    mem_limit: 2g
    pids_limit: 512
    volumes:
      # The only host path the browser container can reach: the screenshots, the
      # job it is given and the results it returns. No database, no config, no
      # dataset: the host picks the targets, then validates every result before
      # it becomes a row (src/lookalike_hunter/capture/handoff.py).
      # `lookalike-hunter capture` sets LH_CAPTURES_DIR to capture.output_dir.
      - ${LH_CAPTURES_DIR:-./data/captures}:/app/captures
