# Drop-in for lookalike-watch.service, copied to /etc/systemd/system/lookalike-watch.service.d/
# (P1.9). The JSON log lines go to a file the CloudWatch agent reads. The file is opened as
# root before the service drops to its user, so the service user needs no write access.
[Service]
StandardError=append:/var/log/lookalike-hunter/watch.log
