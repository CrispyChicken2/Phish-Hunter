version: 2
updates:
  # The project pulls a browser, a websocket client and an HTTP client into a
  # process that handles hostile input; stale versions are the likeliest way a
  # known CVE gets in.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docker/capture
    schedule:
      interval: weekly
