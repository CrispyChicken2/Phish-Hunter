name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; deny everything else by default.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dependencies are installed without the project itself (see below), so the
      # package is imported from the source tree.
      PYTHONPATH: src
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to point at other
      # code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      # --no-build refuses source distributions, so no dependency can run a setup
      # script during install; --locked forbids resolving anything the lockfile
      # does not already pin. Our own project is the one source tree that would
      # need building, so it is not installed here: PYTHONPATH covers it instead.
      - run: uv sync --locked --no-build --no-install-project --all-extras

      - name: Install Chromium for capture tests
        run: uv run --frozen --no-build --no-sync playwright install --with-deps chromium
      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict them via AppArmor, which stops Chromium's
        # sandbox from starting. Lift it so CI exercises the production setting
        # (chromium_sandbox: true) instead of a weakened one.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: uv run --frozen --no-build --no-sync ruff check .
      - run: uv run --frozen --no-build --no-sync ruff format --check .
      - run: uv run --frozen --no-build --no-sync mypy src tests
      - run: uv run --frozen --no-build --no-sync pytest -q

  # Infrastructure (infra/). Nothing here needs AWS: validation runs without a backend
  # and makes no API call, so the job holds no credential and cannot change the account.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.6"
      - name: Format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Security scan
        # Pinned version. Runs in the same way as locally (see the infra checks in STATUS.md).
        run: uvx --from checkov==3.3.29 checkov -d infra --framework terraform --quiet --compact
