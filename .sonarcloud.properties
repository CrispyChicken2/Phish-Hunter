# SonarQube Cloud configuration.
#
# NOTE: automatic analysis reads this file (not sonar-project.properties), but it
# does NOT honour sonar.issue.ignore.* directives: verified by re-analysis, the
# issues below still appear. The exception is kept here because it does apply if
# the project ever switches to CI-based analysis. Until then the same exception
# has to be recorded in the UI by marking the issues Accepted.
#
# The exception: python:S5332 ("using HTTP is insecure") fires on the HTTP
# fallback in the capture policy, which is deliberate. Phishing kits are routinely
# served over plain HTTP, the visit is a one-way read of a hostile page, and no
# data is ever sent to it. Refusing cleartext would blind the scanner to part of
# what it exists to find.
sonar.issue.ignore.multicriteria=httpFallback

sonar.issue.ignore.multicriteria.httpFallback.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.httpFallback.resourceKey=src/lookalike_hunter/capture/policy.py
