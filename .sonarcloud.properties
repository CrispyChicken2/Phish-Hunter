# SonarQube Cloud configuration.
#
# This file (not sonar-project.properties) is what automatic analysis reads.
#
# One documented exception. python:S5332 ("using HTTP is insecure") fires on the
# HTTP fallback in the capture policy, which is deliberate: phishing kits are
# routinely served over plain HTTP, the visit is a one-way read of a hostile page
# and no data is ever sent to it. Refusing cleartext would blind the scanner to
# part of what it exists to find, so the rule is disabled for that file only.
sonar.issue.ignore.multicriteria=httpFallback

sonar.issue.ignore.multicriteria.httpFallback.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.httpFallback.resourceKey=src/lookalike_hunter/capture/policy.py
